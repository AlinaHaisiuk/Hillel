<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Users CRUD</title>
  </head>
  <body>
    <h1>Users CRUD</h1>

    <!-- Форма для добавления одного пользователя -->
    <h2>Create User</h2>
    <form id="createUserForm">
      <label for="name">Name:</label>
      <input type="text" id="name" required /><br /><br />
      <label for="email">Email:</label>
      <input type="email" id="email" required /><br /><br />
      <label for="age">Age:</label>
      <input type="number" id="age" required /><br /><br />
      <label for="hobbies">Hobbies (comma-separated):</label>
      <input type="text" id="hobbies" required /><br /><br />
      <button type="submit">Create User</button>
    </form>

    <hr />

    <!-- Форма для обновления одного пользователя -->
    <h2>Update User</h2>
    <form id="updateUserForm">
      <label for="updateUserId">User ID:</label>
      <input type="text" id="updateUserId" required /><br /><br />
      <label for="updateName">Name:</label>
      <input type="text" id="updateName" /><br /><br />
      <label for="updateEmail">Email:</label>
      <input type="email" id="updateEmail" /><br /><br />
      <label for="updateAge">Age:</label>
      <input type="number" id="updateAge" /><br /><br />
      <label for="updateHobbies">Hobbies:</label>
      <input type="text" id="updateHobbies" /><br /><br />
      <button type="submit">Update User</button>
    </form>

    <hr />

    <!-- Форма для удаления одного пользователя -->
    <h2>Delete User</h2>
    <form id="deleteUserForm">
      <label for="deleteUserId">User ID:</label>
      <input type="text" id="deleteUserId" required /><br /><br />
      <button type="submit">Delete User</button>
    </form>

    <hr />

    <!-- Список пользователей -->
    <h2>Users List</h2>
    <ul id="userList"></ul>

    <script>
      // Функция для отображения всех пользователей
      async function getUsers() {
        const response = await fetch("/users");
        const users = await response.json();
        const userList = document.getElementById("userList");
        userList.innerHTML = ""; // Очистить текущий список
        users.forEach((user) => {
          const li = document.createElement("li");
          li.textContent = `${user.name} - ${user.email} - ${user.age} years old`;
          userList.appendChild(li);
        });
      }

      // Добавление нового пользователя
      document
        .getElementById("createUserForm")
        .addEventListener("submit", async (event) => {
          event.preventDefault();
          const name = document.getElementById("name").value;
          const email = document.getElementById("email").value;
          const age = document.getElementById("age").value;
          const hobbies = document.getElementById("hobbies").value.split(",");

          const response = await fetch("/users", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ name, email, age, hobbies }),
          });

          if (response.ok) {
            alert("User created successfully!");
            getUsers(); // Обновить список пользователей
          } else {
            alert("Error creating user!");
          }
        });

      // Обновление пользователя
      document
        .getElementById("updateUserForm")
        .addEventListener("submit", async (event) => {
          event.preventDefault();
          const id = document.getElementById("updateUserId").value;
          const name = document.getElementById("updateName").value;
          const email = document.getElementById("updateEmail").value;
          const age = document.getElementById("updateAge").value;
          const hobbies = document
            .getElementById("updateHobbies")
            .value.split(",");

          const response = await fetch(`/users/${id}`, {
            method: "PUT",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ name, email, age, hobbies }),
          });

          if (response.ok) {
            alert("User updated successfully!");
            getUsers(); // Обновить список пользователей
          } else {
            alert("Error updating user!");
          }
        });

      // Удаление пользователя
      document
        .getElementById("deleteUserForm")
        .addEventListener("submit", async (event) => {
          event.preventDefault();
          const id = document.getElementById("deleteUserId").value;

          const response = await fetch(`/users/${id}`, {
            method: "DELETE",
          });

          if (response.ok) {
            alert("User deleted successfully!");
            getUsers(); // Обновить список пользователей
          } else {
            alert("Error deleting user!");
          }
        });

      // Получение списка пользователей при загрузке страницы
      getUsers();
    </script>
  </body>
</html>
